<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore | Kazehana</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <div class="ambient-background">
        <div class="grid-overlay"></div>

        <!-- Working Japan Map SVG CDN -->
        <div class="japan-map">
            <img src="https://cdn.jsdelivr.net/gh/djaiss/mapsicon@master/all/jp/vector.svg" alt="" aria-hidden="true">
        </div>

        <div class="blob blob-one"></div>
        <div class="blob blob-two"></div>
        <div class="blob blob-three"></div>
        <div class="blob blob-four"></div>
    </div>
    <style>
        #starfield {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* =========================================
           RESET & DESIGN TOKENS
        ========================================== */

        :root {
            --bg-deep: #020203;
            --bg-base: #050506;
            --bg-elevated: #0a0a0c;

            --foreground: #ededed;
            --muted: #8a8f98;

            --accent: #5e6ad2;
            --accent-light: #9aa4ff;

            --border: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(255, 255, 255, 0.16);

            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family: "Inter", sans-serif;
            color: var(--foreground);

            background:
                radial-gradient(ellipse at top,
                    #0a0a0f 0%,
                    #050506 50%,
                    #020203 100%);

            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================
           AMBIENT BACKGROUND
        ========================================== */

        .ambient-background {
            position: fixed;
            inset: 0;

            z-index: -10;
            overflow: hidden;
            pointer-events: none;
        }

        .grid-overlay {
            position: absolute;
            inset: 0;

            opacity: 0.025;

            background-image:
                linear-gradient(rgba(255, 255, 255, 0.15) 1px,
                    transparent 1px),
                linear-gradient(90deg,
                    rgba(255, 255, 255, 0.15) 1px,
                    transparent 1px);

            background-size: 64px 64px;
        }

        .blob {
            position: absolute;

            border-radius: 50%;
            filter: blur(130px);

            animation: float 11s ease-in-out infinite;
        }

        .blob-one {
            width: 900px;
            height: 650px;

            top: -350px;
            left: 50%;

            transform: translateX(-50%, -50%);

            background: rgba(94, 106, 210, 0.20);
        }

        .blob-two {
            width: 600px;
            height: 700px;

            top: 30%;
            left: -400px;

            background: rgba(119, 85, 190, 0.10);

            animation-delay: -4s;
            animation-duration: 14s;
        }

        .blob-three {
            width: 550px;
            height: 650px;

            top: 45%;
            right: -350px;

            background: rgba(74, 90, 210, 0.10);

            animation-delay: -7s;
            animation-duration: 12s;
        }

        @keyframes float {

            0%,
            100% {
                translate: 0 0;
            }

            50% {
                translate: 0 -25px;
            }

        }


        /* =========================================
           JAPAN MAP
        ========================================== */

        /* Decorative Japan Map */
        /* Decorative Japan Map */
        .japan-map {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            max-width: 700px;
            opacity: 0.69;
            pointer-events: none;
            z-index: 0;
            animation:
                mapFloat 14s ease-in-out infinite;
        }

        .japan-map img {
            width: 100%;
            height: auto;
            display: block;
            /* Turns a black SVG white to fit your dark theme */
            filter: invert(1);
        }

        @keyframes mapFloat {

            0%,
            100% {

                transform:

                    translateY(-50%) rotate(-3deg);

            }


            50% {

                transform:

                    translateY(calc(-50% - 18px)) rotate(-1deg);

            }

        }


        /* =========================================
           TOP NAVIGATION
        ========================================== */

        .top-nav {
            width: min(1200px, calc(100% - 48px));

            margin: 0 auto;
            padding: 28px 0;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-button {
            padding: 10px 16px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.03);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: inline-flex;
            align-items: center;
            gap: 10px;

            color: var(--muted);

            font-size: 14px;
            font-weight: 500;

            transition:
                color 250ms ease,
                transform 250ms var(--ease);
        }

        .back-button:hover {
            background: rgba(94, 106, 210, 0.10);
            border-color: rgba(94, 106, 210, 0.30);
            color: #ffffff;
            transform: translateX(-3px);
        }

        .brand {
            font-size: 14px;
            font-weight: 700;

            letter-spacing: -0.03em;
        }

        .brand span {
            color: var(--accent-light);
        }


        /* =========================================
           CATEGORY HERO
        ========================================== */

        .category-hero {
            width: min(1200px, calc(100% - 48px));

            margin: 0 auto;

            padding:
                70px 0 110px;
        }

        .category-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 24px;

            color: var(--accent-light);

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .category-eyebrow::before {
            content: "";

            width: 28px;
            height: 1px;

            background: var(--accent);
        }

        .category-hero h1 {
            max-width: 1050px;

            font-size: clamp(4.5rem, 13vw, 11rem);
            font-weight: 700;

            line-height: 0.82;
            letter-spacing: -0.075em;

            text-transform: uppercase;

            background:
                linear-gradient(180deg,
                    #ffffff 0%,
                    rgba(255, 255, 255, 0.68) 100%);

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .hero-bottom {
            margin-top: 55px;

            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            gap: 50px;
        }

        .category-description {
            max-width: 560px;

            color: var(--muted);

            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.75;
        }

        .subcategory-count {
            flex-shrink: 0;

            color: rgba(255, 255, 255, 0.38);

            font-size: 12px;
            letter-spacing: 0.14em;

            text-transform: uppercase;
        }


        /* =========================================
           SECTION INTRO
        ========================================== */

        .section-divider {
            width: min(1200px, calc(100% - 48px));
            height: 1px;

            margin: 0 auto;

            background: var(--border);
        }

        .section-label {
            padding: 14px 18px;

            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.025);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: min(1200px, calc(100% - 48px));

            margin:
                32px auto 90px;

            display: flex;
            justify-content: space-between;

            color: rgba(255, 255, 255, 0.38);

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.16em;
            text-transform: uppercase;
        }


        /* =========================================
           EDITORIAL SUBCATEGORY LAYOUT
        ========================================== */

        .subcategory-section {
            width: min(1200px, calc(100% - 48px));

            margin: 0 auto;
            padding-bottom: 150px;
        }

        .subcategory-list {
            display: flex;
            flex-direction: column;
            gap: 100px;
        }


        /* ---------- BASE ITEM ---------- */

        .subcategory-item {
            position: relative;

            display: grid;
            grid-template-columns: 1fr 1fr;

            align-items: center;
            gap: 60px;

            min-height: 420px;
        }

        .subcategory-item.reverse .subcategory-copy {
            order: 2;
        }

        .subcategory-item.reverse .subcategory-visual {
            order: 1;
        }


        /* ---------- TYPOGRAPHY ---------- */

        .subcategory-number {
            display: block;

            margin-bottom: 20px;

            color: rgba(255, 255, 255, 0.35);

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.18em;
        }

        .subcategory-title {
            font-size: clamp(3rem, 7vw, 7rem);
            font-weight: 700;

            line-height: 0.88;
            letter-spacing: -0.065em;

            text-transform: uppercase;

            transition:
                color 300ms ease,
                transform 500ms var(--ease);
        }

        .subcategory-description {
            max-width: 420px;

            margin-top: 25px;

            color: var(--muted);

            font-size: 15px;
            line-height: 1.8;
        }

        .explore-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            margin-top: 28px;

            color: #d8dbff;

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.04em;

            transition: gap 250ms var(--ease);
        }

        .explore-link .arrow {
            font-size: 20px;
            line-height: 1;
        }

        .subcategory-item:hover .explore-link {
            gap: 18px;
        }

        .subcategory-item:hover .subcategory-title {
            color: var(--accent-light);
            transform: translateX(5px);
        }


        /* ---------- IMAGE ---------- */

        .subcategory-visual {

            background: rgba(10, 10, 12, 0.35);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative;

            aspect-ratio: 1 / 0.78;

            overflow: hidden;

            border: 1px solid var(--border);
            border-radius: 18px;

            background: var(--bg-elevated);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            transition:
                transform 600ms var(--ease),
                border-color 300ms ease,
                box-shadow 300ms ease;
        }

        .subcategory-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 0.8;

            transition:
                transform 800ms var(--ease),
                opacity 400ms ease;
        }

        .image-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(135deg,
                    rgba(94, 106, 210, 0.10),
                    transparent 45%,
                    rgba(0, 0, 0, 0.35));
        }

        .subcategory-item:hover .subcategory-visual {
            transform: translateY(-7px);

            border-color: var(--border-hover);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                0 0 70px rgba(94, 106, 210, 0.08);
        }

        .subcategory-item:hover .subcategory-image {
            transform: scale(1.06);
            opacity: 0.95;
        }


        /* ---------- FEATURED LARGE ITEM ---------- */

        .subcategory-item.featured {
            grid-template-columns: 1.1fr 0.9fr;
        }

        .subcategory-item.featured .subcategory-title {
            font-size: clamp(4rem, 9vw, 9rem);
        }

        .subcategory-item.featured .subcategory-visual {
            aspect-ratio: 0.9 / 1;
        }


        /* ---------- BOTTOM FEATURE ---------- */

        .subcategory-item.final-item {
            margin-top: 30px;

            min-height: 520px;

            grid-template-columns: 1fr;
        }

        .subcategory-item.final-item .subcategory-copy {
            position: relative;
            z-index: 2;

            max-width: 700px;
            padding: 60px;
        }

        .subcategory-item.final-item .subcategory-visual {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            aspect-ratio: auto;

            border-radius: 24px;
        }

        .subcategory-item.final-item .subcategory-title {
            font-size: clamp(4rem, 10vw, 9rem);
        }

        .subcategory-item.final-item .subcategory-description {
            color: rgba(255, 255, 255, 0.72);
        }

        .subcategory-item.final-item .subcategory-visual::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(90deg,
                    rgba(2, 2, 3, 0.96) 0%,
                    rgba(2, 2, 3, 0.70) 45%,
                    rgba(2, 2, 3, 0.12) 100%);
        }


        /* =========================================
           LOADING STATE
        ========================================== */

        .loading-message {
            min-height: 400px;

            display: grid;
            place-items: center;

            color: var(--muted);

            font-size: 14px;
        }


        /* =========================================
           FOOTER
        ========================================== */

        .page-footer {
            width: min(1200px, calc(100% - 48px));

            margin: 0 auto;
            padding: 40px 0;

            border-top: 1px solid var(--border);

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: rgba(255, 255, 255, 0.32);

            font-size: 12px;
        }


        /* =========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 850px) {

            .top-nav,
            .category-hero,
            .section-divider,
            .section-label,
            .subcategory-section,
            .page-footer {
                width: min(100% - 32px, 1200px);
            }

            .category-hero {
                padding:
                    50px 0 80px;
            }

            .hero-bottom {
                flex-direction: column;
                align-items: flex-start;

                gap: 25px;
            }

            .subcategory-list {
                gap: 70px;
            }

            .subcategory-item,
            .subcategory-item.featured {
                grid-template-columns: 1fr;
                gap: 30px;

                min-height: auto;
            }

            .subcategory-item.reverse .subcategory-copy,
            .subcategory-item.reverse .subcategory-visual {
                order: initial;
            }

            .subcategory-item.reverse .subcategory-copy {
                order: 2;
            }

            .subcategory-item.reverse .subcategory-visual {
                order: 1;
            }

            .subcategory-item.final-item {
                min-height: 500px;
            }

            .subcategory-item.final-item .subcategory-copy {
                padding: 40px;
            }

        }

        @media (max-width: 560px) {

            .top-nav {
                padding: 22px 0;
            }

            .brand {
                display: none;
            }

            .category-hero {
                padding-top: 45px;
            }

            .category-hero h1 {
                font-size: clamp(3.8rem, 18vw, 6rem);
                line-height: 0.88;
            }

            .category-description {
                font-size: 15px;
            }

            .section-label {
                margin-bottom: 55px;
            }

            .subcategory-list {
                gap: 55px;
            }

            .subcategory-title,
            .subcategory-item.featured .subcategory-title {
                font-size: clamp(2.8rem, 14vw, 5rem);
            }

            .subcategory-description {
                font-size: 14px;
            }

            .subcategory-item.final-item {
                min-height: 450px;
            }

            .subcategory-item.final-item .subcategory-copy {
                padding: 30px;
            }

            .subcategory-item.final-item .subcategory-title {
                font-size: clamp(3rem, 14vw, 5rem);
            }

            .japan-map {
                width: 100vw;
                opacity: 0.12;
            }

            .page-footer {
                flex-direction: column;
                align-items: flex-start;

                gap: 10px;
            }

        }


        /* =========================================
           REDUCED MOTION
        ========================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }

        }

        /* =========================================
   MOUSE FOLLOWING BLUE GLOW
========================================= */

        .mouse-glow {
            position: fixed;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    rgba(94, 106, 210, 0.18) 0%,
                    rgba(94, 106, 210, 0.08) 30%,
                    transparent 70%);

            filter: blur(18px);

            pointer-events: none;

            z-index: -1;

            transform:
                translate(calc(var(--mouse-x, -500px) - 50%),
                    calc(var(--mouse-y, -500px) - 50%));

            transition:
                transform 0.08s linear;

            will-change: transform;
        }

        @media (max-width: 850px) {
            .japan-map {
                width: 95vw;
                max-width: none;
                opacity: 0.35;
                top: 45%;
            }
        }

        @media (max-width: 560px) {
            .japan-map {
                width: 125vw;
                max-width: none;
                top: 42%;
                left: 50%;
                opacity: 0.28;
            }
        }
    </style>
</head>


<body>

    <!-- Mouse glow -->
    <div class="mouse-glow"></div>

    <!-- =========================================
         AMBIENT BACKGROUND
    ========================================== -->

    <div class="ambient-background">
        <canvas id="starfield"></canvas>
        <div class="grid-overlay"></div>

        <div class="blob blob-one"></div>
        <div class="blob blob-two"></div>
        <div class="blob blob-three"></div>
    </div>


    <!-- =========================================
         JAPAN MAP
         Replace src with your current Level 2
         map source if you are using another one.
    ========================================== -->

    <div class="japan-map">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/73/Japan_location_map.svg" alt="" aria-hidden="true">
    </div>


    <!-- =========================================
         TOP NAV
    ========================================== -->

    <nav class="top-nav">

        <a href="article.html" class="back-button">
            ← Back to categories
        </a>

        <div class="brand">
            KAZE<span>HANA</span>
        </div>

    </nav>


    <!-- =========================================
         CATEGORY HERO
    ========================================== -->

    <header class="category-hero">

        <div class="category-eyebrow">
            Explore Japan
        </div>

        <h1 id="category-title">
            Loading
        </h1>

        <div class="hero-bottom">

            <p class="category-description" id="category-description">
                Discover more about Japan.
            </p>

            <span class="subcategory-count" id="subcategory-count">
                Loading sections
            </span>

        </div>

    </header>


    <div class="section-divider"></div>


    <div class="section-label">

        <span>Explore the collection</span>

        <span id="category-label">
            Category
        </span>

    </div>


    <!-- =========================================
         SUBCATEGORIES
    ========================================== -->

    <main class="subcategory-section">

        <div class="subcategory-list" id="subcategory-list">

            <div class="loading-message">
                Preparing your journey through Japan...
            </div>

        </div>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="page-footer">

        <span>
            © 2026 Kazehana
        </span>

        <span>
            Explore Japan, one story at a time.
        </span>

    </footer>


    <!-- =========================================
         PAGE DATA + JAVASCRIPT
    ========================================== -->

    <script>

        /*
        ==================================================
        CATEGORY DATA

        This is Level 3 navigation data.

        Later, if you want, we can move this information
        into Sanity as category/subcategory documents.

        For now, this works perfectly with the subcategory
        values you added to your current Sanity article schema.
        ==================================================
        */

        const categories = {

            "culture": {

                title: "Culture",

                description:
                    "Discover the traditions, customs, everyday rituals and creative expressions that shape the cultural identity of Japan.",

                subcategories: [

                    {
                        title: "Traditions & Customs",

                        slug: "traditions-customs",

                        description:
                            "Explore the practices, ceremonies and customs carried through generations.",

                        image:
                            "https://images.unsplash.com/photo-1528360983277-13d401cdc186?auto=format&fit=crop&w=1200&q=85",

                        featured: true
                    },

                    {
                        title: "Daily Life",

                        slug: "daily-life",

                        description:
                            "Discover the rhythm, routines and small details of everyday life in Japan.",

                        image:
                            "https://images.unsplash.com/photo-1493780474015-ba834fd0ce2f?auto=format&fit=crop&w=1200&q=85",

                        reverse: true
                    },

                    {
                        title: "Etiquette",

                        slug: "etiquette",

                        description:
                            "Understand the unspoken language of respect, manners and social harmony.",

                        image:
                            "https://images.unsplash.com/photo-1542931287-023b922fa89b?auto=format&fit=crop&w=1200&q=85"
                    },

                    {
                        title: "Arts & Crafts",

                        slug: "arts-crafts",

                        description:
                            "Where centuries of craftsmanship meet creativity, patience and human expression.",

                        image:
                            "https://images.unsplash.com/photo-1528164344705-47542687000d?auto=format&fit=crop&w=1200&q=85",

                        reverse: true
                    },

                    {
                        title: "Religion & Spirituality",

                        slug: "religion-spirituality",

                        description:
                            "Explore the beliefs, sacred places and spiritual traditions woven into Japanese life.",

                        image:
                            "https://images.unsplash.com/photo-1478436127897-769e1b3f0f36?auto=format&fit=crop&w=1400&q=85",

                        final: true
                    }

                ]

            },


            "food-drinks": {

                title: "Food & Drinks",

                description:
                    "Travel through Japan's culinary world, from timeless recipes and regional specialties to the food found on everyday streets.",

                subcategories: [

                    {
                        title: "Traditional Cuisine",

                        slug: "traditional-cuisine",

                        description:
                            "Discover the ingredients, techniques and philosophy behind Japan's traditional dishes.",

                        image:
                            "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1200&q=85",

                        featured: true
                    },

                    {
                        title: "Street Food",

                        slug: "street-food",

                        description:
                            "Explore the quick, flavorful and unforgettable food found in Japan's streets and markets.",

                        image:
                            "https://images.unsplash.com/photo-1524413840807-0c3cb6fa808d?auto=format&fit=crop&w=1200&q=85",

                        reverse: true
                    },

                    {
                        title: "Japanese Drinks",

                        slug: "japanese-drinks",

                        description:
                            "From traditional tea culture to modern beverages, discover what Japan drinks.",

                        image:
                            "https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1200&q=85"
                    },

                    {
                        title: "Regional Cuisine",

                        slug: "regional-cuisine",

                        description:
                            "Journey across Japan through the unique dishes and flavors of its regions.",

                        image:
                            "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=1400&q=85",

                        final: true
                    }

                ]

            },


            "history": {

                        featured: true
                    },

                    {
                        title: "Isolation & Loneliness",

                        slug: "isolation-loneliness",

                        description:
                            "Explore social isolation in modern Japan, including hikikomori, loneliness and the challenges of building human connections.",

                        image:
                            "https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1200&q=85",

                    },

                    {

                        slug: "social-pressures",

                        description:

                        image:
                            "https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=1200&q=85"
                    },

                    {
                        title: "Modern Challenges",

                        slug: "modern-challenges",

                        description:
                            "Examine some of Japan's biggest modern challenges, including an aging population, rural depopulation, declining birth rates and economic uncertainty.",

                        image:
                            "https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=1400&q=85",

                        final: true
                    }

                ]

            }

        };




        /*
        ==================================================
        GET CATEGORY FROM URL
        ==================================================
        */

        const params = new URLSearchParams(window.location.search);

        const categorySlug = params.get("category") || "culture";

        const category = categories[categorySlug];


        /*
        ==================================================
        FALLBACK FOR INVALID CATEGORY
        ==================================================
        */

        if (!category) {

            document.getElementById("category-title").textContent =
                "Not Found";

            document.getElementById("category-description").textContent =
                "This category does not exist.";

            document.getElementById("subcategory-count").textContent =
                "";

            document.getElementById("category-label").textContent =
                "Error";

            document.getElementById("subcategory-list").innerHTML =
                `
                <div class="loading-message">
                    Please return to the categories page and choose a category.
                </div>
                `;

        } else {

            /*
            ==============================================
            UPDATE HERO
            ==============================================
            */

            document.title =
                `${category.title} | Kazehana`;

            document.getElementById("category-title").textContent =
                category.title;

            document.getElementById("category-description").textContent =
                category.description;

            document.getElementById("subcategory-count").textContent =
                `${category.subcategories.length} Sections`;

            document.getElementById("category-label").textContent =
                category.title;


            /*
            ==============================================
            BUILD SUBCATEGORY LAYOUT
            ==============================================
            */

            const subcategoryList =
                document.getElementById("subcategory-list");


            subcategoryList.innerHTML =
                category.subcategories.map(
                    (subcategory, index) => {

                        let classes = "subcategory-item";

                        if (subcategory.reverse) {
                            classes += " reverse";
                        }

                        if (subcategory.featured) {
                            classes += " featured";
                        }

                        if (subcategory.final) {
                            classes += " final-item";
                        }


                        return `

                            <a
                                href="subcategory.html?category=${categorySlug}&subcategory=${subcategory.slug}"
                                class="${classes}"
                                aria-label="Explore ${subcategory.title}"
                            >

                                <div class="subcategory-copy">

                                    <span class="subcategory-number">
                                        ${String(index + 1).padStart(2, "0")}
                                        /
                                        ${String(category.subcategories.length).padStart(2, "0")}
                                    </span>

                                    <h2 class="subcategory-title">
                                        ${subcategory.title}
                                    </h2>

                                    <p class="subcategory-description">
                                        ${subcategory.description}
                                    </p>

                                    <span class="explore-link">
                                        Explore section
                                        <span class="arrow">
                                            →
                                        </span>
                                    </span>

                                </div>


                                <div class="subcategory-visual">

                                    <img
                                        class="subcategory-image"
                                        src="${subcategory.image}"
                                        alt="${subcategory.title}"
                                    >

                                    <div class="image-overlay"></div>

                                </div>

                            </a>

                        `;

                    }
                ).join("");

        }

        document.addEventListener("mousemove", (event) => {

            document.documentElement.style.setProperty(
                "--mouse-x",
                `${event.clientX}px`
            );

            document.documentElement.style.setProperty(
                "--mouse-y",
                `${event.clientY}px`
            );

        });

        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        // --- Background Tiny Stars ---
        let stars = [];
        const STAR_COUNT = 540;

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.2 + 0.3,
                    baseAlpha: Math.random() * 0.7 + 0.3,
                    alpha: Math.random(),
                    twinkleSpeed: (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
                    driftX: (Math.random() - 0.5) * 0.05,
                    driftY: (Math.random() - 0.5) * 0.05
                });
            }
        }

        // --- Shooting Stars ---
        let shootingStars = [];

        function createShootingStar() {
            shootingStars.push({
                x: Math.random() * width * 0.8,
                y: Math.random() * (height * 0.5),
                length: Math.random() * 80 + 40,
                speed: Math.random() * 8 + 6,
                angle: Math.PI / 4, // 45 degrees downward movement
                alpha: 1,
                decay: Math.random() * 0.015 + 0.01,
                size: Math.random() * 1.5 + 0.8
            });
        }

        // Trigger random shooting star every 2-5 seconds
        function scheduleShootingStar() {
            const delay = Math.random() * 3000 + 2000;
            setTimeout(() => {
                createShootingStar();
                scheduleShootingStar();
            }, delay);
        }

        // --- Animation Loop ---
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 1. Draw static / drifting stars
            stars.forEach(star => {
                star.alpha += star.twinkleSpeed;
                if (star.alpha >= 1 || star.alpha <= 0.2) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }

                star.x += star.driftX;
                star.y += star.driftY;

                // Wrap around edges
                if (star.x < 0) star.x = width;
                if (star.x > width) star.x = 0;
                if (star.y < 0) star.y = height;
                if (star.y > height) star.y = 0;

                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha * star.baseAlpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Draw shooting stars
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];

                const endX = s.x - Math.cos(s.angle) * s.length;
                const endY = s.y - Math.sin(s.angle) * s.length;

                const gradient = ctx.createLinearGradient(s.x, s.y, endX, endY);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${s.alpha})`);
                gradient.addColorStop(0.3, `rgba(174, 180, 255, ${s.alpha * 0.6})`);
                gradient.addColorStop(1, `rgba(94, 106, 210, 0)`);

                ctx.strokeStyle = gradient;
                ctx.lineWidth = s.size;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                // Head glow point
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size * 1.2, 0, Math.PI * 2);
                ctx.fill();

                // Update position and fade out
                s.x += Math.cos(s.angle) * s.speed;
                s.y += Math.sin(s.angle) * s.speed;
                s.alpha -= s.decay;

                if (s.alpha <= 0) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        initStars();
        scheduleShootingStar();
        animate();

    </script>
