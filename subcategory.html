<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Stories | Kazehana</title>


    <!-- =========================================
         FONTS
    ========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <div class="ambient-background">
        <div class="grid-overlay"></div>

        <!-- Working Japan Map SVG CDN -->
        <div class="japan-map">
            <img src="https://cdn.jsdelivr.net/gh/djaiss/mapsicon@master/all/jp/vector.svg" alt="" aria-hidden="true">
        </div>

        <div class="blob blob-one"></div>
        <div class="blob blob-two"></div>
        <div class="blob blob-three"></div>
        <div class="blob blob-four"></div>
    </div>


    <style>
        #starfield {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* =========================================
           RESET & VARIABLES
        ========================================== */

        :root {

            --bg-deep: #020203;
            --bg-base: #050506;
            --bg-elevated: #0a0a0c;

            --foreground: #ededed;
            --muted: #8a8f98;

            --accent: #5e6ad2;
            --accent-light: #9aa4ff;

            --border:
                rgba(255, 255, 255, 0.07);

            --border-hover:
                rgba(255, 255, 255, 0.16);

            --glass:
                rgba(255, 255, 255, 0.035);

            --ease:
                cubic-bezier(0.16, 1, 0.3, 1);

        }


        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            overflow-x: hidden;

            font-family:
                "Inter",
                sans-serif;

            color:
                var(--foreground);

            background:
                radial-gradient(ellipse at top,
                    #0a0a0f 0%,
                    #050506 50%,
                    #020203 100%);

        }


        a {

            color: inherit;

            text-decoration: none;

        }


        /* =========================================
           AMBIENT BACKGROUND
        ========================================== */

        .ambient-background {

            position: fixed;

            inset: 0;

            z-index: -10;

            overflow: hidden;

            pointer-events: none;

        }


        .grid-overlay {

            position: absolute;

            inset: 0;

            opacity: 0.025;

            background-image:

                linear-gradient(rgba(255, 255, 255, 0.15) 1px,
                    transparent 1px),

                linear-gradient(90deg,
                    rgba(255, 255, 255, 0.15) 1px,
                    transparent 1px);

            background-size:
                64px 64px;

        }


        .blob {

            position: absolute;

            border-radius: 50%;

            filter:
                blur(130px);

            animation:
                float 11s ease-in-out infinite;

        }


        .blob-one {

            width: 900px;
            height: 650px;

            top: -350px;
            left: 50%;

            transform:
                translateX(-50%);

            background:
                rgba(94, 106, 210, 0.20);

        }


        .blob-two {

            width: 600px;
            height: 700px;

            top: 30%;
            left: -400px;

            background:
                rgba(119, 85, 190, 0.10);

            animation-delay: -4s;
            animation-duration: 14s;

        }


        .blob-three {

            width: 550px;
            height: 650px;

            top: 50%;
            right: -350px;

            background:
                rgba(74, 90, 210, 0.10);

            animation-delay: -7s;
            animation-duration: 12s;

        }


        @keyframes float {

            0%,
            100% {

                translate:
                    0 0;

            }


            50% {

                translate:
                    0 -25px;

            }

        }


        /* =========================================
           JAPAN MAP
        ========================================== */

        .japan-map {

            position: fixed;

            top: 50%;
            right: 1%;

            width:
                min(45vw, 680px);

            transform:
                translateY(-50%);

            opacity: 100;

            filter:

                grayscale(1) brightness(1.8) drop-shadow(0 0 50px rgba(94, 106, 210, 0.35));

            pointer-events: none;

            z-index: -8;

            animation:
                mapFloat 14s ease-in-out infinite;

        }


        .japan-map img {

            display: block;

            width: 100%;
            height: auto;

        }


        @keyframes mapFloat {

            0%,
            100% {

                transform:

                    translateY(-50%) rotate(-3deg);

            }


            50% {

                transform:

                    translateY(calc(-50% - 18px)) rotate(-1deg);

            }

        }


        /* =========================================
           BLUE MOUSE GLOW
        ========================================== */

        .mouse-glow {

            position: fixed;

            top: 0;
            left: 0;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            background:

                radial-gradient(circle,

                    rgba(94, 106, 210, 0.18) 0%,

                    rgba(94, 106, 210, 0.08) 30%,

                    transparent 70%);

            filter:
                blur(18px);

            pointer-events: none;

            z-index: -1;

            transform:

                translate(calc(var(--mouse-x, -500px) - 50%),

                    calc(var(--mouse-y, -500px) - 50%));

            transition:
                transform 0.08s linear;

            will-change:
                transform;

        }


        /* =========================================
           CONTENT LAYER
        ========================================== */

        .top-nav,
        .subcategory-hero,
        .section-divider,
        .content-section,
        .page-footer {

            position: relative;

            z-index: 1;

        }


        /* =========================================
           TOP NAVIGATION
        ========================================== */

        .top-nav {

            width:
                min(1200px,
                    calc(100% - 48px));

            margin:
                0 auto;

            padding:
                28px 0;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

        }


        .back-button {

            display:
                inline-flex;

            align-items: center;

            gap: 10px;

            padding:
                10px 16px;

            color:
                var(--muted);

            font-size:
                14px;

            font-weight:
                500;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius:
                999px;

            background:
                rgba(255, 255, 255, 0.03);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            transition:

                color 250ms ease,

                transform 250ms var(--ease),

                background 250ms ease,

                border-color 250ms ease;

        }


        .back-button:hover {

            color:
                #ffffff;

            transform:
                translateX(-3px);

            background:
                rgba(94, 106, 210, 0.10);

            border-color:
                rgba(94, 106, 210, 0.30);

        }


        .brand {

            font-size:
                14px;

            font-weight:
                700;

            letter-spacing:
                -0.03em;

        }


        .brand span {

            color:
                var(--accent-light);

        }


        /* =========================================
           HERO
        ========================================== */

        .subcategory-hero {

            width:
                min(1200px,
                    calc(100% - 48px));

            margin:
                0 auto;

            padding:
                70px 0 100px;

        }


        .breadcrumb {

            display:
                flex;

            align-items: center;

            gap: 10px;

            margin-bottom:
                30px;

            color:
                var(--accent-light);

            font-size:
                11px;

            font-weight:
                600;

            letter-spacing:
                0.16em;

            text-transform:
                uppercase;

        }


        .breadcrumb-divider {

            color:
                rgba(255, 255, 255, 0.28);

        }


        .subcategory-hero h1 {

            max-width:
                1050px;

            font-size:
                clamp(4rem,
                    12vw,
                    10rem);

            font-weight:
                700;

            line-height:
                0.82;

            letter-spacing:
                -0.075em;

            text-transform:
                uppercase;

            background:

                linear-gradient(180deg,

                    #ffffff 0%,

                    rgba(255,
                        255,
                        255,
                        0.65) 100%);

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

        }


        .hero-bottom {

            margin-top:
                55px;

            display:
                flex;

            align-items:
                flex-end;

            justify-content:
                space-between;

            gap:
                50px;

        }


        .subcategory-description {

            max-width:
                600px;

            color:
                var(--muted);

            font-size:
                clamp(1rem,
                    2vw,
                    1.2rem);

            line-height:
                1.75;

        }


        .article-count {

            flex-shrink: 0;

            color:
                rgba(255,
                    255,
                    255,
                    0.38);

            font-size:
                11px;

            font-weight:
                600;

            letter-spacing:
                0.16em;

            text-transform:
                uppercase;

        }


        /* =========================================
           DIVIDER
        ========================================== */

        .section-divider {

            width:
                min(1200px,
                    calc(100% - 48px));

            height:
                1px;

            margin:
                0 auto;

            background:
                var(--border);

        }


        /* =========================================
           MAIN CONTENT
        ========================================== */

        .content-section {

            width:
                min(1200px,
                    calc(100% - 48px));

            margin:
                0 auto;

            padding:
                80px 0 140px;

        }


        .section-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

            margin-bottom:
                35px;

        }


        .section-title {

            color:
                rgba(255,
                    255,
                    255,
                    0.55);

            font-size:
                11px;

            font-weight:
                600;

            letter-spacing:
                0.18em;

            text-transform:
                uppercase;

        }


        .section-number {

            color:
                rgba(255,
                    255,
                    255,
                    0.32);

            font-size:
                11px;

            letter-spacing:
                0.14em;

        }


        /* =========================================
           FEATURED ARTICLE
        ========================================== */

        .featured-article {

            position:
                relative;

            display:
                grid;

            grid-template-columns:
                1.15fr 0.85fr;

            min-height:
                560px;

            overflow:
                hidden;

            border:
                1px solid var(--border);

            border-radius:
                24px;

            background:
                rgba(255,
                    255,
                    255,
                    0.025);

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

            box-shadow:

                0 35px 90px rgba(0,
                    0,
                    0,
                    0.38),

                inset 0 1px 0 rgba(255,
                    255,
                    255,
                    0.07);

            transition:

                transform 600ms var(--ease),

                border-color 300ms ease,

                box-shadow 300ms ease;

        }


        .featured-article:hover {

            transform:
                translateY(-8px);

            border-color:
                var(--border-hover);

            box-shadow:

                0 45px 110px rgba(0,
                    0,
                    0,
                    0.55),

                0 0 80px rgba(94,
                    106,
                    210,
                    0.10);

        }


        .featured-image-wrap {

            position:
                relative;

            overflow:
                hidden;

        }


        .featured-image {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            transition:
                transform 900ms var(--ease);

        }


        .featured-article:hover .featured-image {

            transform:
                scale(1.06);

        }


        .featured-image-overlay {

            position:
                absolute;

            inset:
                0;

            background:

                linear-gradient(90deg,

                    transparent 55%,

                    rgba(5,
                        5,
                        6,
                        0.30) 100%);

        }


        .featured-content {

            padding:
                60px 55px;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            position:
                relative;

            z-index:
                2;

        }


        .featured-badge {

            display:
                inline-flex;

            align-items:
                center;

            width:
                fit-content;

            padding:
                8px 12px;

            margin-bottom:
                25px;

            border:
                1px solid rgba(154,
                    164,
                    255,
                    0.22);

            border-radius:
                999px;

            background:
                rgba(94,
                    106,
                    210,
                    0.10);

            color:
                var(--accent-light);

            font-size:
                10px;

            font-weight:
                700;

            letter-spacing:
                0.16em;

            text-transform:
                uppercase;

        }


        .featured-title {

            font-size:
                clamp(2.3rem,
                    4vw,
                    4.5rem);

            font-weight:
                700;

            line-height:
                0.94;

            letter-spacing:
                -0.055em;

        }


        .featured-excerpt {

            margin-top:
                24px;

            color:
                var(--muted);

            font-size:
                15px;

            line-height:
                1.8;

        }


        .read-featured {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                12px;

            margin-top:
                32px;

            color:
                #d8dbff;

            font-size:
                13px;

            font-weight:
                600;

            transition:
                gap 250ms var(--ease);

        }


        .featured-article:hover .read-featured {

            gap:
                20px;

        }


        /* =========================================
           ARTICLE LIST
        ========================================== */

        .stories-section {

            margin-top:
                110px;

        }


        .article-list {

            display:
                flex;

            flex-direction:
                column;

        }


        .article-card {

            display:
                grid;

            grid-template-columns:

                70px 230px minmax(0, 1fr) 40px;

            align-items:
                center;

            gap:
                35px;

            padding:
                28px 0;

            border-top:
                1px solid var(--border);

            transition:

                padding 350ms var(--ease),

                border-color 300ms ease;

        }


        .article-card:last-child {

            border-bottom:
                1px solid var(--border);

        }


        .article-card:hover {

            padding-left:
                12px;

            padding-right:
                12px;

            border-color:
                var(--border-hover);

        }


        .article-index {

            color:
                rgba(255,
                    255,
                    255,
                    0.30);

            font-size:
                12px;

            font-weight:
                600;

            letter-spacing:
                0.08em;

        }


        .article-thumbnail {

            position:
                relative;

            width:
                100%;

            aspect-ratio:
                1.4 / 1;

            overflow:
                hidden;

            border:
                1px solid var(--border);

            border-radius:
                12px;

            background:
                rgba(255,
                    255,
                    255,
                    0.03);

        }


        .article-thumbnail img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            transition:
                transform 600ms var(--ease);

        }


        .article-card:hover .article-thumbnail img {

            transform:
                scale(1.07);

        }


        .article-copy {

            min-width:
                0;

        }


        .article-title {

            font-size:
                clamp(1.35rem,
                    2vw,
                    1.8rem);

            font-weight:
                600;

            letter-spacing:
                -0.035em;

            line-height:
                1.2;

            transition:
                color 250ms ease;

        }


        .article-card:hover .article-title {

            color:
                var(--accent-light);

        }


        .article-excerpt {

            max-width:
                650px;

            margin-top:
                10px;

            color:
                var(--muted);

            font-size:
                14px;

            line-height:
                1.65;

        }


        .article-tags {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                7px;

            margin-top:
                14px;

        }


        .article-tag {

            padding:
                5px 9px;

            border:
                1px solid rgba(255,
                    255,
                    255,
                    0.07);

            border-radius:
                999px;

            background:
                rgba(255,
                    255,
                    255,
                    0.025);

            color:
                rgba(255,
                    255,
                    255,
                    0.48);

            font-size:
                10px;

        }


        .article-arrow {

            color:
                rgba(255,
                    255,
                    255,
                    0.45);

            font-size:
                24px;

            transition:

                transform 250ms var(--ease),

                color 250ms ease;

        }


        .article-card:hover .article-arrow {

            color:
                var(--accent-light);

            transform:
                translateX(5px);

        }


        /* =========================================
           EMPTY STATE
        ========================================== */

        .empty-state {

            min-height:
                420px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                flex-start;

            justify-content:
                center;

            padding:
                60px;

            border:
                1px solid var(--border);

            border-radius:
                24px;

            background:
                rgba(255,
                    255,
                    255,
                    0.025);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

        }


        .empty-state h2 {

            font-size:
                clamp(2.5rem,
                    5vw,
                    5rem);

            line-height:
                0.9;

            letter-spacing:
                -0.06em;

        }


        .empty-state p {

            max-width:
                480px;

            margin-top:
                25px;

            color:
                var(--muted);

            font-size:
                15px;

            line-height:
                1.8;

        }


        /* =========================================
           LOADING & ERROR
        ========================================== */

        .status-box {

            min-height:
                400px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            border:
                1px solid var(--border);

            border-radius:
                24px;

            background:
                rgba(255,
                    255,
                    255,
                    0.02);

            backdrop-filter:
                blur(12px);

        }


        .loader {

            width:
                34px;

            height:
                34px;

            margin-bottom:
                20px;

            border:
                2px solid rgba(255,
                    255,
                    255,
                    0.10);

            border-top-color:
                var(--accent-light);

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        .status-box p {

            color:
                var(--muted);

            font-size:
                14px;

            line-height:
                1.7;

        }


        /* =========================================
           FOOTER
        ========================================== */

        .page-footer {

            width:
                min(1200px,
                    calc(100% - 48px));

            margin:
                0 auto;

            padding:
                40px 0;

            border-top:
                1px solid var(--border);

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            color:
                rgba(255,
                    255,
                    255,
                    0.32);

            font-size:
                12px;

        }


        /* =========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 900px) {

            .top-nav,
            .subcategory-hero,
            .section-divider,
            .content-section,
            .page-footer {

                width:
                    calc(100% - 32px);

            }


            .subcategory-hero {

                padding:

                    50px 0 80px;

            }


            .hero-bottom {

                flex-direction:
                    column;

                align-items:
                    flex-start;

                gap:
                    25px;

            }


            .featured-article {

                grid-template-columns:
                    1fr;

            }


            .featured-image-wrap {

                min-height:
                    350px;

            }


            .featured-content {

                padding:
                    45px;

            }


            .article-card {

                grid-template-columns:

                    50px 170px minmax(0, 1fr) 30px;

                gap:
                    22px;

            }

        }


        @media (max-width: 650px) {

            .brand {

                display:
                    none;

            }


            .subcategory-hero h1 {

                font-size:
                    clamp(3.5rem,
                        17vw,
                        6rem);

            }


            .content-section {

                padding-top:
                    55px;

            }


            .featured-image-wrap {

                min-height:
                    280px;

            }


            .featured-content {

                padding:
                    35px 28px;

            }


            .article-card {

                grid-template-columns:

                    1fr 32px;

                gap:
                    16px;

                padding:
                    24px 0;

            }


            .article-index {

                display:
                    none;

            }


            .article-thumbnail {

                grid-column:
                    1 / -1;

                max-width:
                    100%;

            }


            .article-copy {

                grid-column:
                    1;

            }


            .article-arrow {

                grid-column:
                    2;

                grid-row:
                    2;

            }


            .empty-state {

                padding:
                    35px;

            }


            .japan-map {

                width:
                    100vw;

                right:
                    -30%;

                opacity:
                    0.035;

            }


            .page-footer {

                flex-direction:
                    column;

                align-items:
                    flex-start;

                gap:
                    10px;

            }

        }


        /* =========================================
           REDUCED MOTION
        ========================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;

                scroll-behavior:
                    auto !important;

            }

        }

        .japan-map {
            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 80vw;
            max-width: 900px;

            opacity: 0.6999;
            pointer-events: none;
            filter: invert(1);
        }

        .japan-map {
            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 80vw;
            max-width: 900px;

            opacity: 0.6999;
            pointer-events: none;
            filter: invert(1);
        }
    </style>
</head>


<body>


    <!-- =========================================
         MOUSE GLOW
    ========================================== -->

    <div class="mouse-glow"></div>


    <!-- =========================================
         AMBIENT BACKGROUND
    ========================================== -->

    <div class="ambient-background">

        <canvas id="starfield"></canvas>

        <div class="grid-overlay"></div>

        <div class="blob blob-one"></div>

        <div class="blob blob-two"></div>

        <div class="blob blob-three"></div>

    </div>


    <!-- =========================================
         JAPAN MAP
    ========================================== -->

    <div class="japan-map">

        <img src="https://upload.wikimedia.org/wikipedia/commons/7/73/Japan_location_map.svg" alt="" aria-hidden="true">

    </div>


    <!-- =========================================
         TOP NAV
    ========================================== -->

    <nav class="top-nav">

        <a href="javascript:history.back()" class="back-button">
            ← Back
        </a>


        <div class="brand">

            KAZE<span>HANA</span>

        </div>

    </nav>


    <!-- =========================================
         HERO
    ========================================== -->

    <header class="subcategory-hero">

        <div class="breadcrumb">

            <span id="category-name">
                Culture
            </span>

            <span class="breadcrumb-divider">
                /
            </span>

            <span>
                Collection
            </span>

        </div>


        <h1 id="subcategory-title">

            Loading

        </h1>


        <div class="hero-bottom">

            <p class="subcategory-description" id="subcategory-description">
                Discover stories from Japan.
            </p>


            <span class="article-count" id="article-count">
                Loading stories
            </span>

        </div>

    </header>


    <div class="section-divider"></div>


    <!-- =========================================
         ARTICLES
    ========================================== -->

    <main class="content-section">

        <div id="content-container">

            <div class="status-box">

                <div class="loader"></div>

                <p>
                    Gathering stories from Kazehana...
                </p>

            </div>

        </div>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="page-footer">

        <span>
            © 2026 Kazehana | 風花
        </span>


        <span>
            Explore Japan, one story at a time.
        </span>

    </footer>


    <script>

        /* =========================================
           CONFIGURATION
        ========================================== */

        const API_URL =
            "https://backend.souzou.in/articles";


        /* =========================================
           SUBCATEGORY INFORMATION
        ========================================== */

        const subcategoryData = {

            "traditions-customs": {

                title:
                    "Traditions & Customs",

                description:
                    "Stories, rituals and practices carried across generations, revealing the traditions that continue to shape Japan today."

            },


            "daily-life": {

                title:
                    "Daily Life",

                description:
                    "Discover the routines, rhythms and small details that shape everyday life across Japan."

            },


            "etiquette": {

                title:
                    "Etiquette",

                description:
                    "Explore the unspoken language of manners, respect and social harmony in Japanese life."

            },


            "arts-crafts": {

                title:
                    "Arts & Crafts",

                description:
                    "Discover the creativity, patience and craftsmanship behind Japan's enduring artistic traditions."

            },


            "religion-spirituality": {

                title:
                    "Religion & Spirituality",

                description:
                    "Explore sacred places, beliefs and spiritual traditions woven deeply into Japanese culture."

            },


            "traditional-cuisine": {

                title:
                    "Traditional Cuisine",

                description:
                    "Discover the ingredients, techniques and philosophy behind Japan's timeless culinary traditions."

            },


            "street-food": {

                title:
                    "Street Food",

                description:
                    "Explore the fast, flavorful and unforgettable food found in Japan's streets and markets."

            },


            "japanese-drinks": {

                title:
                    "Japanese Drinks",

                description:
                    "From tea traditions to modern favorites, discover the drinks that are part of Japanese life."

            },


            "regional-cuisine": {

                title:
                    "Regional Cuisine",

                description:
                    "Travel across Japan through the unique dishes, ingredients and flavors of each region."

            },


            "ancient-japan": {

                title:
                    "Ancient Japan",

                description:
                    "Explore the early civilizations, kingdoms and cultural foundations that shaped Japan."

            },


            "samurai-shogun": {

                title:
                    "Samurai & Shogun",

                description:
                    "Discover the warriors, rulers and political systems that defined Japan's feudal eras."

            },


            "modern-japan": {

                title:
                    "Modern Japan",

                description:
                    "Follow Japan's transformation into a modern nation and the changes that shaped it."

            },


            "gods-deities": {

                title:
                    "Gods & Deities",

                description:
                    "Explore the kami and divine figures that inhabit the world of Japanese mythology."

            },


            "yokai-spirits": {

                title:
                    "Yokai & Spirits",

                description:
                    "Enter the mysterious world of supernatural beings and spirits from Japanese folklore."

            },


            "legends-folktales": {

                title:
                    "Legends & Folktales",

                description:
                    "Discover stories passed through generations, where imagination and tradition meet."

            },


            "seasonal-festivals": {

                title:
                    "Seasonal Festivals",

                description:
                    "Explore celebrations connected to the changing seasons of Japan."

            },


            "religious-festivals": {

                title:
                    "Religious Festivals",

                description:
                    "Discover ceremonies and celebrations rooted in Japan's spiritual traditions."

            },


            "major-festivals": {

                title:
                    "Major Festivals",

                description:
                    "Experience some of Japan's most famous, colorful and spectacular celebrations."

            }

        };


        /* =========================================
           GET URL PARAMETERS
        ========================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const category =
            params.get("category");


        const subcategory =
            params.get("subcategory");


        const currentData =
            subcategoryData[subcategory];


        /* =========================================
           FORMAT CATEGORY
        ========================================== */

        function formatCategory(value) {

            if (!value) {

                return "Explore";

            }


            return value

                .replace(/-/g, " ")

                .replace(
                    /\b\w/g,
                    letter =>
                        letter.toUpperCase()
                );

        }


        /* =========================================
           UPDATE HERO
        ========================================== */

        if (currentData) {

            document.title =
                `${currentData.title} | Kazehana | 風花`;


            document.getElementById(
                "category-name"
            ).textContent =
                formatCategory(category);


            document.getElementById(
                "subcategory-title"
            ).textContent =
                currentData.title;


            document.getElementById(
                "subcategory-description"
            ).textContent =
                currentData.description;

        }


        /* =========================================
           ESCAPE HTML
        ========================================== */

        function escapeHtml(text) {

            if (!text) {

                return "";

            }


            const div =
                document.createElement("div");


            div.textContent =
                text;


            return div.innerHTML;

        }


        /* =========================================
           TAGS
        ========================================== */

        function createTags(tags) {

            if (
                !tags ||
                !Array.isArray(tags) ||
                tags.length === 0
            ) {

                return "";

            }


            return `

                <div class="article-tags">

                    ${tags

                    .slice(0, 4)

                    .map(
                        tag =>

                            `
                                <span
                                    class="article-tag"
                                >
                                    ${escapeHtml(tag)}
                                </span>
                                `
                    )

                    .join("")
                }

                </div>

            `;

        }


        /* =========================================
           IMAGE FALLBACK
        ========================================== */

        const FALLBACK_IMAGE =
            "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1200&q=85";


        /* =========================================
           ARTICLE LINK

           Change this later if your final
           article-reader filename is different.
        ========================================== */

        function getArticleLink(slug) {

            return `article-reader.html?slug=${encodeURIComponent(slug)}`;

        }


        /* =========================================
           RENDER EMPTY STATE
        ========================================== */

        function renderEmptyState() {

            document.getElementById(
                "content-container"
            ).innerHTML = `

                <div class="empty-state">

                    <h2>
                        No stories<br>
                        yet.
                    </h2>

                    <p>
                        This part of Kazehana is still waiting
                        for its first story. Check back soon as
                        new stories are added to the collection.
                    </p>

                </div>

            `;

        }


        /* =========================================
           RENDER ERROR
        ========================================== */

        function renderError() {

            document.getElementById(
                "content-container"
            ).innerHTML = `

                <div class="status-box">

                    <p>
                        We couldn't reach the Kazehana archive.<br>
                        Please make sure the backend is running.
                    </p>

                </div>

            `;

        }


        /* =========================================
           RENDER ARTICLES
        ========================================== */

        function renderArticles(articles) {

            const featuredArticle =
                articles.find(
                    article =>
                        article.featured === true
                );


            const regularArticles =
                articles.filter(
                    article =>
                        article !== featuredArticle
                );


            let html = "";


            /* -------------------------------------
               FEATURED ARTICLE
            ------------------------------------- */

            if (featuredArticle) {

                html += `

                    <section
                        class="featured-section"
                    >

                        <div
                            class="section-header"
                        >

                            <span
                                class="section-title"
                            >
                                Featured story
                            </span>

                            <span
                                class="section-number"
                            >
                                01
                            </span>

                        </div>


                        <a
                            href="${getArticleLink(featuredArticle.slug)}"
                            class="featured-article"
                        >

                            <div
                                class="featured-image-wrap"
                            >

                                <img
                                    class="featured-image"
                                    src="${featuredArticle.heroImageUrl ||
                    FALLBACK_IMAGE
                    }"
                                    alt="${escapeHtml(
                        featuredArticle.title
                    )
                    }"
                                >

                                <div
                                    class="featured-image-overlay"
                                ></div>

                            </div>


                            <div
                                class="featured-content"
                            >

                                <span
                                    class="featured-badge"
                                >
                                    Featured
                                </span>


                                <h2
                                    class="featured-title"
                                >
                                    ${escapeHtml(
                        featuredArticle.title
                    )
                    }
                                </h2>


                                <p
                                    class="featured-excerpt"
                                >
                                    ${escapeHtml(
                        featuredArticle.excerpt ||
                        "Discover this story from Japan."
                    )
                    }
                                </p>


                                ${createTags(
                        featuredArticle.tags
                    )}


                                <span
                                    class="read-featured"
                                >
                                    Read story
                                    →
                                </span>

                            </div>

                        </a>

                    </section>

                `;

            }


            /* -------------------------------------
               REGULAR ARTICLES
            ------------------------------------- */

            if (
                regularArticles.length > 0
            ) {

                html += `

                    <section
                        class="stories-section"
                    >

                        <div
                            class="section-header"
                        >

                            <span
                                class="section-title"
                            >
                                All stories
                            </span>

                            <span
                                class="section-number"
                            >
                                ${String(
                    regularArticles.length
                ).padStart(2, "0")
                    }
                                STORIES
                            </span>

                        </div>


                        <div
                            class="article-list"
                        >

                            ${regularArticles

                        .map(
                            (
                                article,
                                index
                            ) =>

                                `

                                        <a
                                            href="${getArticleLink(article.slug)}"
                                            class="article-card"
                                        >

                                            <span
                                                class="article-index"
                                            >
                                                ${String(
                                    index + 1
                                ).padStart(
                                    2,
                                    "0"
                                )}
                                            </span>


                                            <div
                                                class="article-thumbnail"
                                            >

                                                <img
                                                    src="${article.heroImageUrl ||
                                FALLBACK_IMAGE
                                }"

                                                    alt="${escapeHtml(
                                    article.title
                                )
                                }"
                                                >

                                            </div>


                                            <div
                                                class="article-copy"
                                            >

                                                <h3
                                                    class="article-title"
                                                >
                                                    ${escapeHtml(
                                    article.title
                                )
                                }
                                                </h3>


                                                <p
                                                    class="article-excerpt"
                                                >
                                                    ${escapeHtml(
                                    article.excerpt ||
                                    "Discover this story from Japan."
                                )
                                }
                                                </p>


                                                ${createTags(
                                    article.tags
                                )}

                                            </div>


                                            <span
                                                class="article-arrow"
                                            >
                                                →
                                            </span>

                                        </a>

                                        `
                        )

                        .join("")
                    }

                        </div>

                    </section>

                `;

            }


            /*
            If there is only one article and it is
            featured, we don't need the All Stories
            section.
            */

            document.getElementById(
                "content-container"
            ).innerHTML =
                html;

        }


        /* =========================================
           FETCH ARTICLES
        ========================================== */

        async function loadArticles() {

            /*
            Invalid URL protection
            */

            if (
                !category ||
                !subcategory ||
                !currentData
            ) {

                document.getElementById(
                    "subcategory-title"
                ).textContent =
                    "Not Found";


                document.getElementById(
                    "subcategory-description"
                ).textContent =
                    "This collection does not exist.";


                document.getElementById(
                    "article-count"
                ).textContent =
                    "";


                renderEmptyState();

                return;

            }


            try {

                const response =
                    await fetch(
                        API_URL
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "Failed to fetch articles"
                    );

                }


                const allArticles =
                    await response.json();


                /*
                Filter by BOTH category
                and subcategory
                */

                const matchingArticles =
                    allArticles.filter(
                        article =>

                            article.category ===
                            category

                            &&

                            article.subcategory ===
                            subcategory
                    );


                /*
                Update article count
                */

                document.getElementById(
                    "article-count"
                ).textContent =
                    `${matchingArticles.length} ${matchingArticles.length === 1
                        ? "Story"
                        : "Stories"
                    }`;


                /*
                Render
                */

                if (
                    matchingArticles.length === 0
                ) {

                    renderEmptyState();

                    return;

                }


                renderArticles(
                    matchingArticles
                );

            }

            catch (error) {

                console.error(
                    "Error loading articles:",
                    error
                );


                document.getElementById(
                    "article-count"
                ).textContent =
                    "Archive unavailable";


                renderError();

            }

        }


        /* =========================================
           MOUSE GLOW
        ========================================== */

        document.addEventListener(
            "mousemove",
            event => {

                document.documentElement.style.setProperty(
                    "--mouse-x",
                    `${event.clientX}px`
                );


                document.documentElement.style.setProperty(
                    "--mouse-y",
                    `${event.clientY}px`
                );

            }
        );


        /* =========================================
           START
        ========================================== */

        loadArticles();

        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        // --- Background Tiny Stars ---
        let stars = [];
        const STAR_COUNT = 540;

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.2 + 0.3,
                    baseAlpha: Math.random() * 0.7 + 0.3,
                    alpha: Math.random(),
                    twinkleSpeed: (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
                    driftX: (Math.random() - 0.5) * 0.05,
                    driftY: (Math.random() - 0.5) * 0.05
                });
            }
        }

        // --- Shooting Stars ---
        let shootingStars = [];

        function createShootingStar() {
            shootingStars.push({
                x: Math.random() * width * 0.8,
                y: Math.random() * (height * 0.5),
                length: Math.random() * 80 + 40,
                speed: Math.random() * 8 + 6,
                angle: Math.PI / 4, // 45 degrees downward movement
                alpha: 1,
                decay: Math.random() * 0.015 + 0.01,
                size: Math.random() * 1.5 + 0.8
            });
        }

        // Trigger random shooting star every 2-5 seconds
        function scheduleShootingStar() {
            const delay = Math.random() * 3000 + 2000;
            setTimeout(() => {
                createShootingStar();
                scheduleShootingStar();
            }, delay);
        }

        // --- Animation Loop ---
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 1. Draw static / drifting stars
            stars.forEach(star => {
                star.alpha += star.twinkleSpeed;
                if (star.alpha >= 1 || star.alpha <= 0.2) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }

                star.x += star.driftX;
                star.y += star.driftY;

                // Wrap around edges
                if (star.x < 0) star.x = width;
                if (star.x > width) star.x = 0;
                if (star.y < 0) star.y = height;
                if (star.y > height) star.y = 0;

                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha * star.baseAlpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Draw shooting stars
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];

                const endX = s.x - Math.cos(s.angle) * s.length;
                const endY = s.y - Math.sin(s.angle) * s.length;

                const gradient = ctx.createLinearGradient(s.x, s.y, endX, endY);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${s.alpha})`);
                gradient.addColorStop(0.3, `rgba(174, 180, 255, ${s.alpha * 0.6})`);
                gradient.addColorStop(1, `rgba(94, 106, 210, 0)`);

                ctx.strokeStyle = gradient;
                ctx.lineWidth = s.size;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                // Head glow point
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size * 1.2, 0, Math.PI * 2);
                ctx.fill();

                // Update position and fade out
                s.x += Math.cos(s.angle) * s.speed;
                s.y += Math.sin(s.angle) * s.speed;
                s.alpha -= s.decay;

                if (s.alpha <= 0) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        initStars();
        scheduleShootingStar();
        animate();

    </script>

</body>
